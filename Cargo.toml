[package]
name = "backend_vibrance"
version = "0.1.0"
edition = "2021"

[dependencies]
# Axum con feature "headers" para usar extractores y módulos de headers
axum = { version = "0.6", features = ["headers"] }
tokio = { version = "1.28", features = ["macros"] }

tower-http = { version = "0.4", features = ["cors"] }


# SQLx con soporte para SQLite
sqlx = { version = "0.6", features = ["runtime-tokio-native-tls", "sqlite"] }

# Serialización con serde
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Para cargar variables de entorno
dotenv = "0.15"

# JWT
jsonwebtoken = "8.3"

# Argon2 (usamos la API basada en traits)
argon2 = "0.4"

# Random
rand = "0.8"

# UUID con feature "v4"
uuid = { version = "1.4", features = ["v4"] }

# Manejo de errores
anyhow = "1.0"
thiserror = "1.0"

# Fechas y horas para expiraciones en JWT
chrono = "0.4"

reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
